<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Honda Dealer | Admin</title><link rel="stylesheet" href="css/style.css"><style>[hidden]{display:none!important}.admin-login{max-width:460px;margin:60px auto;padding:28px}.admin-login label{display:block;margin:15px 0}.admin-login input{width:100%}.admin-header{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.admin-header .brand{margin-right:auto}@media print{.admin-header,#adminLogin{display:none!important}}</style><link rel="stylesheet" href="css/pro.css"></head><body data-role="admin"><header class="site-header admin-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>HONDA<span class="brand-sub">ADMIN DEALER</span></span></a><a class="btn btn-outline" href="index.html">Website pelanggan</a><button id="logout" class="btn btn-red" hidden>Logout</button></header><main><div id="proRoot"></div><template id="reportTemplate">    <section id="laporan" class="section report-section">
      <div class="section-heading"><div><p class="eyebrow">DASHBOARD INTERNAL · DEMO</p><h2>Laporan Penjualan & Marketing</h2><p class="muted">Analisis tiga bulan kalender hingga bulan pilihan. Data awal adalah simulasi, bukan transaksi nyata.</p></div></div>
      <div class="report-tools"><label>Bulan akhir <input type="month" id="reportMonth"></label><button id="exportReport" class="btn btn-dark">Unduh CSV</button><button id="printReport" class="btn btn-outline">Cetak laporan</button><button id="clearReport" class="btn btn-outline">Kosongkan data</button><button id="resetReport" class="btn btn-outline">Muat data demo</button></div>
      <p id="reportPeriod" class="muted"></p><div id="reportKpi" class="report-kpi"></div>
      <div class="report-grid"><article class="panel"><h3>Tren penjualan bulanan</h3><div id="salesChart"></div></article><article class="panel"><h3>Tipe mobil paling laku</h3><div id="modelChart"></div></article></div>
      <article class="panel report-panel"><h3>Peringkat penjualan marketing</h3><p class="muted">Diurutkan berdasarkan jumlah unit terjual, lalu omzet.</p><div class="report-scroll"><table><thead><tr><th>Peringkat</th><th>Marketing</th><th>Tim</th><th>Unit</th><th>Omzet</th></tr></thead><tbody id="marketingRank"></tbody></table></div><h3>Penjualan per tim</h3><div id="teamChart"></div></article>
      <article class="panel report-panel"><p class="eyebrow">REWARD MARKETING</p><h3>Evaluasi kinerja & rekomendasi reward</h3><p class="muted">Bobot dan target mengikuti pengaturan dashboard Reward. Presensi = hadir / hari kerja; review = rata-rata rating / 5. Seluruh komponen berskala 0–100. Data presensi dan review harus lengkap untuk mengikuti reward.</p><div id="rewardWinner" class="reward-winner"></div><div class="report-scroll"><table><thead><tr><th>Rank</th><th>Marketing</th><th>Presensi</th><th>Unit / target</th><th>Review</th><th>Skor</th><th>Reward</th></tr></thead><tbody id="rewardRank"></tbody></table></div></article>
      <div class="report-grid report-panel"><form id="saleEntry" class="panel"><h3>Input penjualan (form lama)</h3><label>Tanggal<input type="date" id="saleDate" required></label><label>Marketing<select id="salePerson"></select></label><label>Tipe mobil<select id="saleModel"></select></label><label>Unit terjual<input type="number" id="saleQty" min="1" max="10000" value="1" required></label><label>Harga per unit (Rp)<input type="number" id="salePrice" min="1" max="100000000000" required></label><label>Referensi transaksi (opsional)<input id="saleReference" maxlength="80"></label><label>Komisi penjualan (%)<input id="saleRate" type="number" min="0" max="100" step="0.01" value="1" required></label><button class="btn btn-red" type="submit">Simpan penjualan</button></form>
      <form id="performanceEntry" class="panel"><h3>Input presensi & review bulanan</h3><label>Bulan<input type="month" id="perfMonth" required></label><label>Marketing<select id="perfPerson"></select></label><label>Hari kerja<input type="number" id="perfDays" min="1" max="31" required></label><label>Hari hadir<input type="number" id="perfPresent" min="0" max="31" required></label><label>Rata-rata rating customer (1–5)<input type="number" id="perfRating" min="1" max="5" step="0.01" required></label><label>Jumlah review<input type="number" id="perfReviews" min="1" max="100000" required></label><button class="btn btn-red" type="submit">Simpan / perbarui evaluasi</button></form></div>
      <article class="panel report-panel"><h3>Kelola anggota marketing</h3><form id="personEntry" class="report-tools"><label>Nama<input id="personName" maxlength="60" required></label><label>Tim<input id="personTeam" maxlength="60" required></label><label>Username sales<input id="personUsername" required pattern="[a-zA-Z0-9_-]+"></label><label>Password sales<input id="personPassword" type="password" minlength="6" required></label><button class="btn btn-red">Tambah anggota</button></form><div id="personList"></div></article>
      <article class="panel report-panel"><h3>Riwayat penjualan periode terpilih</h3><div class="report-scroll"><table><thead><tr><th>Tanggal</th><th>Marketing</th><th>Tipe</th><th>Unit</th><th>Omzet</th><th>Referensi</th><th>Komisi</th><th>Aksi</th></tr></thead><tbody id="saleHistory"></tbody></table></div><h3>Riwayat evaluasi</h3><div class="report-scroll"><table><thead><tr><th>Bulan</th><th>Marketing</th><th>Hadir / kerja</th><th>Rating</th><th>Jumlah review</th><th>Aksi</th></tr></thead><tbody id="perfHistory"></tbody></table></div></article>
      <article class="panel report-panel"><h3>Rekap komisi marketing</h3><p class="muted">Komisi dihitung dari transaksi yang dicatat admin; bukan bukti pembayaran.</p><div class="report-scroll"><table><thead><tr><th>Marketing</th><th>Unit</th><th>Komisi</th></tr></thead><tbody id="commissionRank"></tbody></table></div><h3>Absensi harian sales</h3><p class="muted">Hari hadir untuk reward menggunakan nilai terbesar antara rekap manual dan jumlah check-in unik, dibatasi hari kerja. Admin tetap mengisi hari kerja dan review bulanan.</p><div class="report-scroll"><table><thead><tr><th>Tanggal</th><th>Sales</th><th>Jam masuk</th></tr></thead><tbody id="attendanceHistory"></tbody></table></div></article><p id="reportMessage" role="status" class="muted"></p><p class="fine-print">Data disimpan di browser ini (localStorage). Login ini hanya simulasi antarmuka, bukan keamanan server. Tidak ada sinkronisasi antarperangkat atau verifikasi transaksi. Jangan memasukkan data pribadi pelanggan.</p>
    </section>
</template><div id="adminDashboard" hidden></div></main><script src="js/catalog.js"></script><script src="js/car-images.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script><script src="js/hero-slides.js"></script><script src="js/pro.js"></script></body></html>
