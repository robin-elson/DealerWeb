<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Honda Dealer | Login</title><link rel="stylesheet" href="css/style.css"><style>.login-panel{max-width:460px;margin:64px auto;padding:32px}.login-panel label{display:block;margin:16px 0}.login-panel input{width:100%}.login-header{display:flex;justify-content:space-between;gap:12px}.login-panel button{width:100%}</style></head><body><header class="site-header login-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>HONDA<span class="brand-sub">DEALER</span></span></a><a class="btn btn-outline" href="index.html">Kembali</a></header><main><section class="panel login-panel"><p class="eyebrow">PORTAL INTERNAL</p><h2>Login</h2><p class="muted">Masuk menggunakan akun admin atau sales. Dashboard akan disesuaikan dengan akun Anda.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-red" type="submit">Masuk</button><p id="loginError" role="alert" style="color:#b91c1c"></p></form><p><a class="text-link" href="dosen.html">Panduan Penilaian Dosen & akun demo ↗</a></p><p class="fine-print">Demo GitHub Pages untuk tugas kelompok. Jangan gunakan kata sandi atau data pribadi nyata.</p></section></main><script src="js/catalog.js"></script><script src="js/store.js"></script><script src="js/login.js"></script><script>const demoUser=new URLSearchParams(location.search).get('demo');if(['admin','andi','bella','citra','dimas'].includes(demoUser)){document.getElementById('username').value=demoUser;document.getElementById('password').value=demoUser==='admin'?'HondaAdmin123':'Sales123';}</script></body></html>
